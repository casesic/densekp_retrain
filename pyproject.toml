[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "densekp-retrain-staging"
version = "0.1.0"
requires-python = ">=3.10,<3.12"
# Base install = the former [model] group. Dataset, training, inference and the
# evaluation commands are this repository's main job, so `pip install .` should
# give a working one. The lighter capability groups below stay optional so a
# data-only, geometry-only or EXR-only environment does not pull Torch.
# Not a lockfile: measured local versions and the offline procedure live in
# docs/environment/INSTALLATION.md.
dependencies = [
    "numpy>=1.23.5,<2", "scipy", "opencv-python-headless<4.12", "Pillow",
    "torch>=2.0,<2.1", "torchvision>=0.15,<0.16", "pytorch-lightning==2.0.2",
    "timm==1.0.12", "einops", "yacs", "hydra-core", "omegaconf",
    "pyrootutils", "rich", "matplotlib", "tensorboard", "hydra-colorlog",
    "scikit-image", "albumentations>=1.3,<2",
]

[project.optional-dependencies]
# Capability groups, not a lockfile. See docs/environment/INSTALLATION.md for
# the measured local versions and offline installation procedure.
data = ["numpy>=1.23.5,<2", "scipy", "opencv-python-headless<4.12", "Pillow", "PyYAML"]
# `model` used to hold this list; it is now the base `dependencies` above.
# Kept as an empty alias so existing `pip install .[model]` instructions in
# docs/environment/INSTALLATION.md keep working instead of failing on an
# unknown extra.
model = []
geometry = ["numpy>=1.23.5,<2", "scipy", "torch>=2.0,<2.1", "smplx==0.1.28", "trimesh"]
exr = ["numpy>=1.23.5,<2", "OpenEXR==3.5.1"]

[tool.setuptools]
package-dir = {"" = "src", "densekp" = "densekp"}
include-package-data = false
# setup.py discovers only these two source trees. It never scans outputs or
# asset directories, and never imports either runtime package during a build.
